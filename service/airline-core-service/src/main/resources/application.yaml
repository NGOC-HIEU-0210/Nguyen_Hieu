server:
  port: 5002

spring:
  application:
    name: airline-core-service

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=yt_airline_db;encrypt=true;trustServerCertificate=true
    username: hieu
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  eureka:
    client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
        defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true